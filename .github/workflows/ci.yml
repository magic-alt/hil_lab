name: RTL CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verilog:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install RTL tools
        run: |
          sudo apt-get update
          sudo apt-get install -y iverilog verilator make python3

      - name: Verify RTL
        run: make verify
